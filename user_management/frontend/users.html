<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Usuários</title>
    </head>
    <body>
        <h3>Criar usuário</h3>

        <form id="createForm">
            <input id="newUsername" placeholder="Username" required>
            <input id="newEmail" placeholder="Email" required>
            <input id="newPassword" placeholder="Senha" required>
            <button type="submit">Criar</button>
        </form>

        <hr>


        <h2>Lista de Usuários</h2>

        <button onclick="logout()">Logout</button>

        <ul id="userList"></ul>

        <script>
            const API ="";
            const token = localStorage.getItem("token");

            if (!token) {
                alert("Faça login primeiro");
                window.location.href = "login.html";
            }


            //============================================
            // Listar Usuários
            //=============================================

            async function loadUsers() {
                const res = await fetch("/users", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    alert("Erro ao carregar usuários");
                    return;
                }
            

                const users = await res.json();
                const list = document.getElementById("userList");
                list.innerHTML = "";

                users.forEach(u => {
                    const li = document.createElement("li");

                    li.innerHTML = `
                        ${u.id} - ${u.username} - ${u.email}
                        <button onclick="deleteUser(${u.id})">Deletar</button>
                    `;

                    list.appendChild(li);
                });
            }

            //===========================
            // CREATE USER
            //===========================

            document.getElementById("createForm")
            .addEventListener("submit", async (e)) => {
                e.preventDefault();

                const username = document.getElementById("newUsername").value;
                const email = document.getElementById("newEmail").value;
                const password = document.getElementById("newPassword").value;

                const res = await fetch(`/users`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });

                const data = await res.json();
            }

            //=========================
            // DELETE USER
            //=========================

            async function deleteUser(id){
                if (!confirme("Deseja deletar?")) return;

                const res = await fetch(`/users/${id}`,{
                    method: "DELETE",
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!res.ok) {
                    alert("Erro ao deletar");
                    return;
                }
                loadUsers();
            }

            //======================
            // LOGOUT
            //=======================

            function logout() {
                localStorage.removeItem("token");
                window.location.href = "/static/login.html";
            }
            //========================
            // INIT
            //=============================

            loadUsers();

        </script>
    </body>
</html>
